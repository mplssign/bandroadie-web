name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        # Pin an exact stable patch version instead of floating `channel: stable`
        # so CI upgrades are intentional and reviewed. This avoids silent breakage
        # when a new stable release lands and upstream packages are not ready yet.
        # Tradeoff: this requires manual version bumps to adopt newer patches.
        with:
          flutter-version: "3.47.1"

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test
