name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        # Temporary pin: forui 0.25.0 (current pinned version) is incompatible
        # with Flutter 3.47's semantics-merge changes (Flutter flutter/flutter#191095).
        # forui's fix (PR duobaseio/forui#1165) is merged upstream but not yet
        # published to pub.dev as of this commit. Revert to `channel: stable`
        # (or bump to the exact next forui release once it ships Flutter 3.47
        # support) once forui publishes.
        with:
          flutter-version: "3.44.6"

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test
