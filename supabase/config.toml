# Supabase local development configuration
# Production project: nekwjxvgbveheooyorjo (us-east-2)
# Link: supabase link --project-ref nekwjxvgbveheooyorjo

project_id = "bandroadie"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Update this to your production site URL when testing locally
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "https://app.bandroadie.com/auth/confirm",
  "https://app.bandroadie.com/auth/callback",
  "bandroadie://login-callback/"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[analytics]
enabled = false
port = 54327
backend = "postgres"

# ============================================================================
# EDGE FUNCTIONS
# verify_jwt = true  → requires valid Supabase JWT in Authorization header
# verify_jwt = false → no JWT required (use internal auth, e.g. X-Internal-Secret)
#
# IMPORTANT: These settings must match what is deployed in production.
# Changing verify_jwt here and redeploying will override the production setting.
# ============================================================================

[functions.musicbrainz_search]
verify_jwt = true

[functions.send-band-invite]
verify_jwt = true

[functions.send-bug-report]
verify_jwt = true

[functions.accept-invite]
verify_jwt = true

[functions.auth-confirm]
verify_jwt = true

[functions.send-push]
# Called by pg_net DB trigger — no JWT, authenticated via X-Internal-Secret + PUSH_TRIGGER_SECRET
verify_jwt = false

[functions.deliver-notifications]
# Called internally — no JWT required
verify_jwt = false

[functions.calendar-feed]
# Public calendar URL authenticated via per-band token parameter — no JWT
verify_jwt = false

[functions.getsongbpm_lookup]
verify_jwt = true

[functions.itunes_search]
verify_jwt = true