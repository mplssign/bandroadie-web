# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Swift Package Manager checkouts under build/ contain third-party Dart
    # files (e.g. swift-protobuf examples) that must not be analyzed.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  # 2026-09-02: the Copilot pipeline's Engineer/QA gates only ever failed on
  # `error`-severity output ("0 errors"); every one of these ships at `info`
  # by default, which is exactly the band AI-generated slop shows up in, so
  # the gate was silently ignoring it. These are also the mechanical,
  # lint-checkable equivalents of guardrails engineer.agent.md/qa.agent.md
  # already state in prose (mounted-guard after async gaps, disposing
  # controllers/subscriptions) - promoting them to `error` makes those
  # guardrails fail closed instead of relying on the model to notice.
  errors:
    unused_import: error
    unused_local_variable: error
    unused_element: error
    unused_field: error
    dead_code: error
    use_build_context_synchronously: error
    unawaited_futures: error
    cancel_subscriptions: error
    close_sinks: error

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
    # 2026-09-02: AI-slop lints. Some of these may already be on via
    # flutter_lints; listed explicitly so they're pinned regardless of what
    # upstream changes. See analyzer.errors above for the severity bump that
    # actually makes these block instead of just annotate.
    avoid_unnecessary_containers: true
    use_colored_box: true
    use_decorated_box: true
    sized_box_for_whitespace: true
    unnecessary_overrides: true
    unnecessary_null_checks: true
    unnecessary_non_null_assertion: true
    unnecessary_late: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    unnecessary_string_interpolations: true
    unnecessary_getters_setters: true
    unnecessary_await_in_return: true
    avoid_redundant_argument_values: true
    use_super_parameters: true
    prefer_const_constructors: true
    avoid_print: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
