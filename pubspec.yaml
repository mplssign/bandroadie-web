name: bandroadie
description: "Gig and setlist management for bands."
publish_to: "none"

version: 1.2.9+111

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # UI / Visual
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.0
  confetti: ^0.7.0

  # State / Routing
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1

  # Backend
  supabase_flutter: ^2.12.0
  http: ^1.6.0

  # Storage / Sharing
  shared_preferences: ^2.2.2
  share_plus: ^10.1.4
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.1
  permission_handler: ^11.3.1

  # Documents / Export
  printing: ^5.13.4
  pdf: ^3.11.1

  # Web utilities
  web: ^1.1.0
  intl: ^0.20.2

  # Firebase (Push)
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Local Notifications (Mobile)
  flutter_local_notifications: ^18.0.1

  # Deep Linking
  app_links: ^6.4.1
  lucide_flutter: ^0.575.0

  # Timezone
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
